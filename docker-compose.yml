# The practice lab. Every port is bound to 127.0.0.1: this computer only. Never change that.
services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    ports:
      - "127.0.0.1:3000:3000"
  proxy:
    image: nginx:1.27-alpine
    depends_on: [juice-shop]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/nginx
    ports:
      - "127.0.0.1:8080:80"
